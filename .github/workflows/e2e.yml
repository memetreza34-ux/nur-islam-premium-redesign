name: End-to-end smoke

# Browser rendering is isolated in the official Playwright image so CI does not
# spend each run reinstalling Chromium and system packages on ubuntu-latest.
on:
  push:
    branches: [premium-design-finish, final-design-release-pass]
  pull_request:
    branches: [main, premium-design-finish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
