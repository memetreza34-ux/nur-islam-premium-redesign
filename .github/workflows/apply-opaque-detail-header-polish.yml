name: Apply opaque detail header polish

on:
  push:
    branches: [opaque-detail-header-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[opaque-header-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make sticky detail headers visually opaque
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/premium-reference-geometry-lock.css')
          source = path.read_text()
          dark_old = "background: linear-gradient(145deg, rgba(0, 27, 22, .94), rgba(0, 18, 15, .96)) !important;"
          dark_new = "background: linear-gradient(145deg, #001b16, #00120f) !important;"
          light_old = "background: rgba(255, 252, 243, .94) !important;"
          light_new = "background: #fffcf3 !important;"
          if source.count(dark_old) != 1:
              raise SystemExit('Expected exactly one dark detail-header background target')
          if source.count(light_old) != 1:
              raise SystemExit('Expected exactly one light detail-header background target')
          source = source.replace(dark_old, dark_new).replace(light_old, light_new)
          path.write_text(source)
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/premium-reference-geometry-lock.css
          git commit -m "[opaque-header-patch] Make sticky detail headers opaque"
          git push origin HEAD:opaque-detail-header-polish
