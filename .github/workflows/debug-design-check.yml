name: Temporary design check diagnostics

on:
  push:
    branches: [premium-design-finish]

permissions:
  contents: read

concurrency:
  group: temporary-design-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run check with concise failure annotation
        shell: bash
        run: |
          set +e
          npm run check > check-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 check-output.log
            message=$(tail -n 24 check-output.log | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Nur Islam design check failure::$message"
            exit "$status"
          fi
          tail -n 30 check-output.log
