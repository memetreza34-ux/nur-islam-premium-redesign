name: Premium redesign check

on:
  workflow_dispatch:
  push:
    branches: [main, premium-home-redesign, premium-design-finish, final-design-release-pass]
  pull_request:
    branches: [main, premium-home-redesign, premium-design-finish]

permissions:
  contents: read

concurrency:
  group: premium-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  release-readiness:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify strict release gates before merge to main
        run: npm run check
        env:
          NUR_RELEASE: 'true'
