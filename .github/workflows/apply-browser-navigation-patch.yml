name: Apply browser navigation patch

on:
  push:
    branches:
      - premium-design-finish
    paths:
      - 'scripts/apply-browser-navigation-patch.mjs'
      - '.github/workflows/apply-browser-navigation-patch.yml'

permissions:
  contents: write

concurrency:
  group: apply-browser-navigation-patch
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current design branch
        uses: actions/checkout@v7
        with:
          ref: premium-design-finish
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply exact guarded patch
        run: node scripts/apply-browser-navigation-patch.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full repository check
        run: npm run check

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end flows
        run: npm run test:e2e

      - name: Verify patch diff
        run: |
          git diff --check
          git status --short
          git diff -- src/app/App.tsx scripts/check-navigation.mjs e2e/core-flows.spec.ts

      - name: Commit verified patch and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-browser-navigation-patch.mjs .github/workflows/apply-browser-navigation-patch.yml
          git add src/app/App.tsx scripts/check-navigation.mjs e2e/core-flows.spec.ts
          git commit -m "Integrate browser and system Back navigation"
          git push --no-verify origin HEAD:premium-design-finish
