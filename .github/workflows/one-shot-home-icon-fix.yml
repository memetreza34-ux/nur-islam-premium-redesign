name: One-shot Home icon cleanup

on:
  push:
    branches: [final-home-icon-cleanup]
    paths:
      - '.github/workflows/one-shot-home-icon-fix.yml'

permissions:
  contents: write

env:
  PREVIEW_URL: http://127.0.0.1:4173/

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: final-home-icon-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Replace decorative fasting glyph with Lucide icon
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/App.tsx')
          text = path.read_text()
          old_import = "  CrescentObject,\n"
          old_usage = '<span className="recommendation-card__icon"><CrescentObject /></span>'
          new_usage = '<span className="recommendation-card__icon"><MoonStar size={22} /></span>'

          if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one CrescentObject import, found {text.count(old_import)}')
          if text.count(old_usage) != 1:
              raise SystemExit(f'Expected exactly one CrescentObject recommendation, found {text.count(old_usage)}')

          text = text.replace(old_import, '', 1).replace(old_usage, new_usage, 1)
          path.write_text(text)
          PY

      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: Install Chromium for visual QA
        run: npx playwright install --with-deps chromium

      - name: Build local production preview
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/nur-preview.log 2>&1 &
          echo $! > /tmp/nur-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent --show-error "$PREVIEW_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nur-preview.log
          exit 1

      - name: Capture core visual QA
        run: node scripts/capture-reference-preview.mjs

      - name: Upload Home visual QA
        uses: actions/upload-artifact@v7
        with:
          name: final-home-icon-cleanup-preview
          path: artifacts/reference-preview/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git diff --cached --check
          git commit -m "Use Lucide icon for fasting recommendation"
          git push origin HEAD:final-home-icon-cleanup
