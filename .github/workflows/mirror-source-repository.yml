name: Mirror Nur Islam source repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-source-repository.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-nur-islam-source
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Validate migration token
        env:
          MIGRATION_PAT: ${{ secrets.MIGRATION_PAT }}
        run: |
          if [ -z "$MIGRATION_PAT" ]; then
            echo "Missing repository secret MIGRATION_PAT."
            echo "Create a fine-grained PAT with read access to memetreza34-ux/nur-islam and save it in this repository as MIGRATION_PAT."
            exit 1
          fi

      - name: Mirror all branches, tags and history
        env:
          MIGRATION_PAT: ${{ secrets.MIGRATION_PAT }}
          TARGET_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${MIGRATION_PAT}@github.com/memetreza34-ux/nur-islam.git" source.git
          cd source.git
          git remote add target "https://x-access-token:${TARGET_TOKEN}@github.com/memetreza34-ux/nur-islam-premium-redesign.git"
          git push --force target 'refs/heads/*:refs/heads/*'
          git push --force target 'refs/tags/*:refs/tags/*'
          echo "Mirror completed. The source repository was read only and was not changed."
