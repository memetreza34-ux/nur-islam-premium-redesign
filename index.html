<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Content Security Policy. connect-src and media-src are the important
      lines: together they are the same list of services the privacy notice
      names, enforced by the browser. If the app ever tried to talk to a host
      that is not documented there, the request would be blocked rather than
      quietly succeed.

      media-src exists for one thing: the recitation recordings in the prayer
      course. Two hosts serve them — islamic.network for the Quran passages (the
      same project behind the already listed api.alquran.cloud) and
      hisnmuslim.com for the transmitted formulas. It grants audio and video
      only: a host on this line cannot run script or be talked to by fetch.

      'unsafe-inline' is required for styles because the animation library sets
      element styles directly; scripts stay restricted to the bundle.
      frame-ancestors is intentionally absent: it is ignored in a meta tag and
      needs a real header, which GitHub Pages cannot set.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' https://cdn.islamic.network https://www.hisnmuslim.com; font-src 'self'; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://overpass-api.de https://overpass.kumi.systems https://jmswsgwnvmvsfayeodcd.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" />
    <!--
      Every request leaving the app otherwise carries the page it came from.
      The mosque finder opens whatever website OpenStreetMap has on record, so
      without this a stranger's server would learn which app sent the visitor.
      Unlike the other hardening headers (X-Content-Type-Options, HSTS,
      Permissions-Policy), the referrer policy is honoured in a meta tag, so it
      works on GitHub Pages, which cannot send headers at all.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#001b16" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Nur Islam – Gebetszeiten, Quran, Dhikr, Qibla und islamisches Wissen in einer ruhigen Premium-App." />
    <meta name="application-name" content="Nur Islam" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nur Islam" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%nur-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%premium-assets/high-res-objects/nur-logo-emblem.png" />

    <!-- Exact Home reference lock. The user-selected reference is deliberately
         isolated to Start; every other screen keeps the existing app system. -->
    <style id="home-reference-hero-lock">
      .app-shell:has(.premium-home--v2) {
        padding-bottom: 0 !important;
      }

      .app-shell:has(.premium-home--v2) .screen-transition-frame {
        overflow: hidden !important;
      }

      .app-shell:has(.premium-home--v2) .bottom-nav,
      body:has(.premium-home--v2) .reference-install-prompt,
      body:has(.premium-home--v2) .background-orbit {
        display: none !important;
      }

      .premium-home--v2 {
        position: relative !important;
        min-height: 100dvh !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #001b16 !important;
      }

      .premium-home--v2::before {
        content: '';
        position: absolute;
        z-index: 20;
        top: 0;
        left: 0;
        width: 100%;
        aspect-ratio: 537 / 476;
        background: url('%BASE_URL%premium-assets/home-reference-hero.webp') top center / 100% 100% no-repeat;
        pointer-events: none;
      }

      .premium-home--v2 > :not(.brand-bar):not(.welcome-hero) {
        display: none !important;
      }

      .premium-home--v2 .welcome-hero {
        opacity: 0 !important;
        pointer-events: none !important;
      }

      .premium-home--v2 .brand-bar {
        position: relative !important;
        z-index: 30 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      .premium-home--v2 .brand-bar__actions,
      .premium-home--v2 .brand-bar__actions .icon-button {
        pointer-events: auto !important;
      }

      @media (min-width: 538px) {
        .premium-home--v2::before {
          left: 50%;
          width: 537px;
          transform: translateX(-50%);
        }
      }
    </style>
    <title>Nur Islam</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Nur Islam benötigt JavaScript, um die App anzuzeigen.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
