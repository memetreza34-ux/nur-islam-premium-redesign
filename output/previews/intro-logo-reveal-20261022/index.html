<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001b16">
  <title>Logo hinter dem Bogen · Intro-Vorschau</title>
  <style>
    :root { color-scheme:dark; --ink:#001b16; --green:#003b29; --gold:#e2bf77; --cream:#fff0c9; }
    * { box-sizing:border-box; }
    body { margin:0; background:#06110e; color:var(--cream); font-family:Inter,system-ui,sans-serif; }
    .preview { min-height:100svh; display:grid; grid-template-rows:auto 1fr; padding:20px; gap:20px; }
    .toolbar { display:flex; width:min(100%,640px); margin:auto; gap:12px; align-items:center; justify-content:space-between; }
    .toolbar strong { color:#c4cfc5; font-size:14px; font-weight:500; }
    .toolbar button,.toolbar a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 16px; border:1px solid #e2bf7747; border-radius:24px; color:var(--cream); background:#12372b; font:600 13px Inter,system-ui,sans-serif; cursor:pointer; text-decoration:none; }
    .toolbar { flex-wrap:wrap; }
    .toolbar button:hover { background:#1c4637; }
    .toolbar button:focus-visible { outline:2px solid var(--gold); outline-offset:4px; }
    .toolbar a:focus-visible { outline:2px solid var(--gold); outline-offset:4px; }
    .device { position:relative; isolation:isolate; width:min(100%,390px); height:min(844px,calc(100svh - 104px)); min-height:360px; margin:auto; overflow:hidden; border-radius:32px; background:var(--ink); box-shadow:0 0 0 1px #ffffff17,0 28px 90px #0007; }
    iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--ink); }
    .intro { position:absolute; inset:0; z-index:2; overflow:hidden; background:radial-gradient(ellipse at 50% 36%,#104534 0%,#032a21 38%,var(--ink) 76%); }
    .intro[hidden] { display:none; }
    .canopy { position:absolute; inset:0; background:radial-gradient(ellipse at 50% -18%,#d9b56822,transparent 59%); pointer-events:none; }
    .portal { position:absolute; inset:16% 8% 7%; transform-origin:50% 52%; }
    .portal-window { position:absolute; inset:0; overflow:hidden; clip-path:url(#portal-cut); background:radial-gradient(ellipse at 50% 45%,#15523b,#003b29 46%,#001b16 92%); perspective:720px; }
    .door { position:absolute; z-index:2; top:0; bottom:0; width:50.15%; backface-visibility:hidden; background:linear-gradient(105deg,#134b38,#073b2c 44%,#002c22); box-shadow:inset 0 0 42px #0004; }
    .door::before { content:""; position:absolute; inset:6% 11%; border:1px solid #b9a36722; box-shadow:0 0 0 7px #002b2018,inset 0 0 0 7px #002b2018; }
    .door::after { content:""; position:absolute; width:1px; top:0; bottom:0; background:linear-gradient(180deg,#fbdf9e55,#d0a45a11,#fbdf9e55); }
    .door--left { left:0; transform-origin:left center; }
    .door--left::after { right:0; }
    .door--right { right:0; transform-origin:right center; background:linear-gradient(80deg,#002c22,#073b2c 55%,#174e3a); }
    .door--right::after { left:0; }
    .seam { position:absolute; z-index:2; left:calc(50% - 1px); top:0; bottom:0; width:2px; background:#fff0c9; box-shadow:0 0 12px 3px #e9c77f6b; opacity:0; transform:scaleY(.12); transform-origin:50% 65%; }
    .brand-reveal { position:absolute; z-index:1; top:32%; left:8%; right:8%; display:flex; flex-direction:column; align-items:center; gap:18px; }
    .emblem { position:relative; width:60%; aspect-ratio:1; border-radius:26%; overflow:hidden; box-shadow:0 18px 40px #0002; opacity:0; transform:translateY(5px) scale(.95); }
    .wordmark { max-width:100%; margin:0; text-align:center; color:var(--cream); font:400 clamp(24px,7vw,30px)/1.15 "Cormorant Garamond",Georgia,serif; letter-spacing:.025em; text-wrap:balance; overflow-wrap:anywhere; opacity:0; transform:translateY(10px); filter:blur(2px); }
    .inner-light { position:absolute; inset:17% 3% 14%; background:radial-gradient(ellipse,#e2bf7717,transparent 65%); opacity:0; }
    .emblem img { display:block; width:100%; height:100%; object-fit:cover; }
    .arch { position:absolute; inset:-1px; width:calc(100% + 2px); height:calc(100% + 2px); overflow:visible; fill:none; pointer-events:none; }
    .arch .body { stroke:url(#arch-metal); stroke-width:11; }
    .arch .bevel { stroke:#fff1c3; stroke-width:1; opacity:.47; }
    .arch .outer { stroke:#b39250; stroke-width:1; opacity:.48; }
    .arch .trace { stroke:#fff1c3; stroke-width:1.8; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; opacity:0; filter:drop-shadow(0 0 5px #ffe4a4); }
    .threshold { position:absolute; left:7%; right:7%; bottom:6.5%; height:1px; background:linear-gradient(90deg,transparent,#c6a45c66,transparent); }
    .floor-light { position:absolute; left:17%; width:66%; bottom:-7%; height:24%; background:radial-gradient(ellipse at 50% 0%,#f5de9c28,transparent 68%); transform:scaleX(.25); opacity:0; }
    .is-playing { animation:enter-app .45s 2.85s ease-in-out forwards; }
    .is-playing .portal { animation:move-through 2.6s .5s cubic-bezier(.45,0,.35,1) forwards; }
    .is-playing .inner-light { animation:inner-glow 1.5s .7s ease-out forwards; }
    .is-playing .door--left { animation:open-left 1.65s .5s cubic-bezier(.42,0,.24,1) forwards; }
    .is-playing .door--right { animation:open-right 1.65s .5s cubic-bezier(.42,0,.24,1) forwards; }
    .is-playing .emblem { animation:brand 1.1s .8s cubic-bezier(.22,1,.36,1) forwards; }
    .is-playing .wordmark { animation:wordmark .65s 1.4s cubic-bezier(.22,1,.36,1) forwards; }
    .is-playing .seam { animation:seam-light 1.3s .12s ease-in-out forwards; }
    .is-playing .arch .trace { animation:trace 1.1s ease-out forwards; }
    .is-playing .floor-light { animation:spill 2.15s .35s ease-out forwards; }
    @keyframes brand { to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes wordmark { to{opacity:1;transform:translateY(0);filter:blur(0)} }
    @keyframes inner-glow { to{opacity:1} }
    @keyframes trace { 5%{opacity:0;stroke-dashoffset:1} 30%{opacity:.9} 100%{opacity:0;stroke-dashoffset:0} }
    @keyframes seam-light { 0%{opacity:0;transform:scaleY(.12)} 48%{opacity:.8;transform:scaleY(1)} 100%{opacity:0;transform:scaleY(1)} }
    @keyframes open-left { to{transform:rotateY(-96deg);filter:brightness(.55)} }
    @keyframes open-right { to{transform:rotateY(96deg);filter:brightness(.55)} }
    @keyframes move-through { to{transform:scale(1.055)} }
    @keyframes spill { 45%{opacity:1;transform:scaleX(1)} 100%{opacity:0;transform:scaleX(1.2)} }
    @keyframes enter-app { to{opacity:0;visibility:hidden} }
    .sr-only { position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap; }
    @media(max-width:480px) { .preview{padding:12px;gap:12px}.device{height:calc(100svh - 80px);border-radius:24px}.toolbar strong{font-size:12px}.toolbar button{font-size:12px;padding:10px 12px} }
    @media(prefers-reduced-motion:reduce) {
      .is-playing,.is-playing * { animation:none!important; }
      .is-playing .emblem { opacity:1;transform:none; }
      .is-playing .wordmark { opacity:1;transform:none;filter:none; }
      .is-playing .door { display:none; }
    }
  </style>
</head>
<body>
  <div class="preview">
    <header class="toolbar"><strong>Intro-Vorschau · Logo und Beispielname</strong><a href="/?preview=1">App öffnen</a><button type="button" id="replay">Noch einmal ansehen</button></header>
    <div class="device">
      <iframe id="app" src="/?preview=1" title="App-Startseite"></iframe>
      <div class="intro" id="intro" aria-label="App-Einstieg">
        <svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs><clipPath id="portal-cut" clipPathUnits="objectBoundingBox"><path d="M0 1V.32C0 .16 .23 .06 .5 0C.77 .06 1 .16 1 .32V1Z"/></clipPath></defs></svg>
        <div class="canopy" aria-hidden="true"></div>
        <div class="portal" aria-hidden="true">
          <div class="portal-window">
            <div class="inner-light"></div>
            <div class="brand-reveal">
              <div class="emblem"><img src="/premium-assets/high-res-objects/nur-logo-mosque-3d-v1.webp?v=20261016-mosque-3d-v1" alt="" fetchpriority="high"></div>
              <p class="wordmark">Dein App-Name</p>
            </div>
            <div class="door door--left"></div><div class="door door--right"></div>
            <div class="seam"></div>
          </div>
          <svg class="arch" viewBox="0 0 300 620" preserveAspectRatio="none"><defs><linearGradient id="arch-metal" x1="0" y1="0" x2="1" y2=".2" gradientUnits="objectBoundingBox"><stop stop-color="#695631"/><stop offset=".2" stop-color="#bd9b58"/><stop offset=".48" stop-color="#fae4ac"/><stop offset=".65" stop-color="#bd9b58"/><stop offset="1" stop-color="#59492c"/></linearGradient></defs><path class="outer" d="M-7 620V198C-7 94 68 29 150-7C232 29 307 94 307 198V620"/><path class="body" d="M0 620V198C0 99 69 37 150 0C231 37 300 99 300 198V620"/><path class="bevel" d="M5 620V198C5 101 73 42 150 5C227 42 295 101 295 198V620"/><path class="trace" pathLength="1" d="M0 620V198C0 99 69 37 150 0C231 37 300 99 300 198V620"/></svg>
        </div>
        <div class="threshold" aria-hidden="true"></div><div class="floor-light" aria-hidden="true"></div>
        <span class="sr-only" role="status">App wird geöffnet</span>
      </div>
    </div>
  </div>
  <script>
    const intro=document.getElementById('intro');
    const app=document.getElementById('app');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    let timer;
    let hasPlayed=false;
    function play(){
      hasPlayed=true;
      clearTimeout(timer);
      intro.hidden=false;
      intro.classList.remove('is-playing');
      void intro.offsetWidth;
      intro.classList.add('is-playing');
      app.inert=true;
      timer=setTimeout(()=>{intro.hidden=true;app.inert=false;},reduced.matches?800:3350);
    }
    const appLoaded=new Promise(resolve=>app.addEventListener('load',resolve,{once:true}));
    const images=[...intro.querySelectorAll('img')].map(image=>image.decode().catch(()=>{}));
    const deadline=new Promise(resolve=>setTimeout(resolve,3500));
    document.getElementById('replay').addEventListener('click',play);
    Promise.race([Promise.all([appLoaded,...images]),deadline]).then(()=>{if(!hasPlayed)play();});
  </script>
</body>
</html>
