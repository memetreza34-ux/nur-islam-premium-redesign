<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nur Islam · Einstiegsvorschau</title>
  <style>
    :root { color-scheme: dark; --ink:#f6eddc; --gold:#dfbb70; --green:#05251e; --muted:#b5c6bc; }
    * { box-sizing:border-box; }
    body { margin:0; background:#061a15; color:var(--ink); font-family:Inter,Arial,sans-serif; }
    .preview { min-height:100svh; display:grid; place-items:center; padding:24px 16px; gap:18px; }
    .toolbar { width:min(100%,390px); display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); }
    button { min-height:44px; padding:10px 14px; border:1px solid #557061; background:#12392d; color:var(--ink); border-radius:12px; font:inherit; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--gold); outline-offset:4px; }
    .scene { position:relative; isolation:isolate; overflow:hidden; width:min(100%,390px); height:min(844px,calc(100svh - 110px)); min-height:480px; border-radius:24px; background:var(--green); box-shadow:0 20px 70px #0005; }
    .art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:52% center; z-index:-1; animation:approach 5s cubic-bezier(.2,.4,.2,1) both; }
    .copy { position:absolute; left:20%; width:64%; text-align:center; text-shadow:0 1px 12px #072d1f50; }
    .prayer { top:21%; animation:reveal 1.1s .15s both; }
    .eyebrow { display:block; color:var(--gold); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; line-height:1.6; }
    .time { margin:10px 0 7px; font:500 29px/1.1 'Cormorant Garamond',Georgia,serif; }
    .time strong { font:500 26px/1.1 Inter,Arial,sans-serif; padding-left:6px; }
    .location { margin:0; font-size:11px; line-height:1.5; }
    .ayah { top:38%; margin:0; animation:reveal 1.2s .45s both; }
    .arabic { margin:17px 0 13px; font:400 30px/1.7 Amiri,serif; }
    blockquote { margin:0; font:500 25px/1.18 'Cormorant Garamond',Georgia,serif; text-wrap:balance; }
    figcaption { margin-top:20px; font-size:10px; line-height:1.7; color:#e0dfcb; }
    figcaption span { display:block; }
    .status { position:absolute; bottom:5%; left:50%; transform:translateX(-50%); white-space:nowrap; margin:0; padding:9px 16px; background:var(--green); border-radius:30px; font-size:11px; animation:reveal 1s .7s both; }
    .status::before { content:''; display:inline-block; width:5px; height:5px; margin-right:8px; vertical-align:2px; border-radius:50%; background:var(--gold); }
    @keyframes approach { from { transform:scale(1); } to { transform:scale(1.035); } }
    @keyframes reveal { from { opacity:0; translate:0 7px; } to { opacity:1; translate:0 0; } }
    @media(max-height:740px) { .prayer { top:15%; } .ayah { top:36%; } .arabic { margin:10px 0; font-size:27px; } blockquote { font-size:23px; } figcaption { margin-top:14px; } }
    @media(prefers-reduced-motion:reduce) { .art,.prayer,.ayah,.status { animation:none; } }
  </style>
</head>
<body>
  <main class="preview">
    <div class="toolbar"><span>Designvorschau · Beispielinhalt</span><button type="button" id="replay">Erneut ansehen</button></div>
    <section class="scene" aria-label="Vorschau der Anfangsanimation">
      <img class="art" src="courtyard-matte-v2.webp" alt="Moscheehof im schlichten 3D-Stil mit glatten cremefarbenen Säulen, grüner Wand und warmem Licht">
      <header class="copy prayer"><span class="eyebrow">Nächstes Gebet</span><p class="time">Asr <strong>15:43</strong></p><p class="location">Berlin, Deutschland</p></header>
      <figure class="copy ayah"><span class="eyebrow">Ayah des Tages</span><p class="arabic" dir="rtl" lang="ar">فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا</p><blockquote>Gewiss, mit der Schwierigkeit kommt Erleichterung.</blockquote><figcaption><span>Sinngemäße Bedeutung</span>Asch-Scharh · Quran 94:5</figcaption></figure>
      <p class="status">App wird geöffnet</p>
    </section>
  </main>
  <script type="module">
    import '@fontsource/inter/400.css';
    import '@fontsource/inter/500.css';
    import '@fontsource/inter/600.css';
    import '@fontsource/cormorant-garamond/500.css';
    import '@fontsource/amiri/400.css';
    document.querySelector('#replay').addEventListener('click', () => {
      document.querySelectorAll('.scene *').forEach(element => {
        element.getAnimations().forEach(animation => { animation.currentTime = 0; animation.play(); });
      });
    });
  </script>
</body>
</html>
